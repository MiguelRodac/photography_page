<div class="bg-surface-800 border border-surface-700 rounded-xl p-6 h-full flex flex-col">
  <!-- Header: icono + titulo + descripcion -->
  <div class="flex items-start gap-4">
    <div class="w-10 h-10 rounded-lg border flex items-center justify-center shrink-0"
         [ngClass]="{
           'bg-blue-500/10 border-blue-500/20 text-blue-400': iconColor() === 'blue',
           'bg-green-500/10 border-green-500/20 text-green-400': iconColor() === 'green',
           'bg-purple-500/10 border-purple-500/20 text-purple-400': iconColor() === 'purple',
           'bg-amber-500/10 border-amber-500/20 text-amber-400': iconColor() === 'amber'
         }">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconPath()" />
      </svg>
    </div>
    <div class="w-full min-w-0">
      <h2 class="text-lg font-semibold text-surface-100">{{ title() }}</h2>
      <p class="text-sm text-surface-400 mt-1">{{ description() }}</p>
    </div>
  </div>
  <!-- Action: empujada al fondo de la card -->
  <div class="mt-auto">
    <ng-content></ng-content>
  </div>
</div>
